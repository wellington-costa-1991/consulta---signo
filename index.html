<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horóscopo Neon - Signo e Ascendente</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0124, #1f0147, #4b0082);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            transition: background 1s ease;
        }
        .container {
            background-color: rgba(15, 12, 30, 0.95);
            padding: 35px 25px;
            border-radius: 20px;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), 0 0 40px rgba(255, 0, 128, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
            transition: border-color 1s ease, box-shadow 1s ease;
        }
        h1 { 
            background: linear-gradient(45deg, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 30px;
            margin-top: 0;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            color: #b0a8ff;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .animais-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 25px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }
        .animal-item {
            font-size: 22px;
            opacity: 0.4;
            transition: 0.3s;
        }
        .animal-item:hover { opacity: 1; transform: scale(1.2); }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
        label {
            display: block;
            color: #00f0ff;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        input[type="date"], input[type="time"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #3d2b7a;
            background-color: #1a0f30;
            color: #ffffff;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        .btn-principal {
            background: linear-gradient(90deg, #ff007f, #ff5500);
            color: #ffffff;
            border: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: 0.3s ease;
            margin-top: 10px;
        }
        .btn-principal:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.7);
        }
        .resultado {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px dashed #3d2b7a;
            display: none;
        }
        .signo-figura {
            font-size: 75px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #00f0ff, 0 0 40px #ff007f;
            animation: pulsar 2s infinite ease-in-out;
        }
        .signo-nome { 
            font-size: 26px; 
            font-weight: 800; 
            color: #00f0ff; 
            margin-bottom: 5px; 
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            text-transform: uppercase;
        }
        .ascendente-nome {
            font-size: 18px;
            color: #ff007f;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .perfil { 
            font-size: 15px; 
            line-height: 1.6; 
            color: #e0dbff; 
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ff007f;
            text-align: left;
            margin-bottom: 20px;
        }
        .btn-whatsapp {
            background: linear-gradient(90deg, #25D366, #128C7E);
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.6);
        }
        @keyframes pulsar {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>Mapa Astral Express</h1>
    <p>Insira seus dados cósmicos para revelar sua energia</p>
    
    <div class="animais-grid">
        <div class="animal-item" title="Áries">🐏</div>
        <div class="animal-item" title="Touro">🐂</div>
        <div class="animal-item" title="Gêmeos">♊</div>
        <div class="animal-item" title="Câncer">🦀</div>
        <div class="animal-item" title="Leão">🦁</div>
        <div class="animal-item" title="Virgem">♍</div>
        <div class="animal-item" title="Libra">⚖️</div>
        <div class="animal-item" title="Escorpião">🦂</div>
        <div class="animal-item" title="Sagitário">🏹</div>
        <div class="animal-item" title="Capricórnio">🐐</div>
        <div class="animal-item" title="Aquário">⚱️</div>
        <div class="animal-item" title="Peixes">🐟</div>
    </div>
    
    <div class="input-group">
        <label id="lblData" for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento">
    </div>

    <div class="input-group">
        <label id="lblHora" for="horaNascimento">Hora de Nascimento</label>
        <input type="time" id="horaNascimento">
    </div>

    <button class="btn-principal" onclick="descobrirMapa()">Revelar Destino</button>

    <div id="resultado" class="resultado">
        <div id="signoFigura" class="signo-figura"></div>
        <div id="signoNome" class="signo-nome"></div>
        <div id="ascendenteNome" class="ascendente-nome"></div>
        <div id="signoPerfil" class="perfil"></div>
        <button class="btn-whatsapp" onclick="compartilharWhatsApp()">🟢 Compartilhar no WhatsApp</button>
    </div>
</div>
